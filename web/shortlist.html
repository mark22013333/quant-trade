<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>短期投資雷達｜Quant Trade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #18231f;
      --paper: #f4f0e5;
      --paper-2: #ebe5d6;
      --line: rgba(24, 35, 31, .16);
      --accent: #e85d2a;
      --green: #156d58;
      --red: #b83a35;
      --muted: #68706b;
      --shadow: 0 24px 60px rgba(24, 35, 31, .11);
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(232, 93, 42, .1), transparent 28rem),
        linear-gradient(90deg, transparent 49.8%, rgba(24,35,31,.035) 50%, transparent 50.2%),
        var(--paper);
    }
    a { color: inherit; }
    .shell { width: min(1240px, calc(100% - 36px)); margin: 0 auto; padding: 28px 0 70px; }
    .masthead {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0 22px; border-bottom: 1px solid var(--ink);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .12em; }
    .brand-mark { width: 13px; height: 13px; background: var(--accent); transform: rotate(45deg); }
    .advanced { color: var(--muted); font-size: 13px; text-decoration: none; border-bottom: 1px solid currentColor; }
    .hero {
      display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, .5fr);
      gap: 54px; padding: 70px 0 48px; align-items: end;
    }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 {
      margin: 14px 0 18px; max-width: 820px;
      font: 900 clamp(42px, 7vw, 88px)/1.02 "Noto Serif TC", serif;
      letter-spacing: -.06em;
    }
    .lede { max-width: 680px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.8; }
    .status-card {
      padding: 22px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow);
      border-radius: 2px; position: relative; overflow: hidden;
    }
    .status-card::after {
      content: ""; position: absolute; width: 110px; height: 110px; right: -42px; top: -48px;
      border: 18px solid rgba(232, 93, 42, .75); border-radius: 50%;
    }
    .status-label { color: rgba(244,240,229,.58); font-size: 11px; letter-spacing: .15em; }
    .status-main { margin-top: 10px; font: 700 24px/1.25 "Noto Serif TC", serif; }
    .status-meta { margin-top: 14px; color: rgba(244,240,229,.67); font-size: 12px; line-height: 1.6; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center; gap: 20px;
      padding: 22px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    .asof { font-size: 13px; color: var(--muted); }
    .refresh {
      appearance: none; border: 0; padding: 14px 22px; background: var(--accent); color: white;
      font: 700 14px "Noto Sans TC", sans-serif; cursor: pointer; border-radius: 1px;
      box-shadow: 4px 4px 0 var(--ink); transition: transform .18s ease, box-shadow .18s ease;
    }
    .refresh:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
    .refresh:disabled { opacity: .55; cursor: wait; }
    .notice {
      display: none; margin-top: 20px; padding: 14px 16px; border-left: 3px solid var(--accent);
      background: rgba(232,93,42,.08); color: #6f301c; font-size: 13px;
    }
    .notice.show { display: block; }
    .list { margin-top: 32px; display: grid; gap: 12px; }
    .empty {
      padding: 70px 30px; text-align: center; border: 1px dashed var(--line);
      color: var(--muted); background: rgba(255,255,255,.18);
    }
    .pick {
      display: grid; grid-template-columns: 76px minmax(190px,.65fr) minmax(260px,1.45fr) minmax(210px,.9fr);
      gap: 20px; align-items: stretch; min-height: 174px;
      background: rgba(255,255,255,.45); border: 1px solid var(--line); box-shadow: 0 1px 0 rgba(255,255,255,.75);
      animation: reveal .55s both; animation-delay: calc(var(--i) * 55ms);
    }
    @keyframes reveal { from { opacity: 0; transform: translateY(13px); } to { opacity: 1; transform: none; } }
    .rank {
      display: grid; place-items: center; border-right: 1px solid var(--line);
      font: 900 36px "Noto Serif TC", serif; color: var(--accent);
    }
    .identity { padding: 24px 0; }
    .symbol { font: 800 26px "Noto Serif TC", serif; letter-spacing: -.03em; }
    .name { margin-top: 3px; font-size: 14px; color: var(--muted); }
    .score { margin-top: 20px; font-size: 12px; color: var(--muted); }
    .score strong { color: var(--ink); font-size: 17px; margin-left: 5px; }
    .thesis { padding: 23px 10px 23px 0; }
    .section-label { margin-bottom: 8px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .15em; }
    .summary { line-height: 1.75; font-size: 14px; }
    .summary.muted { color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
    .tag { padding: 5px 8px; border: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .evidence {
      padding: 23px 20px; background: rgba(24,35,31,.035); border-left: 1px solid var(--line);
    }
    .sentiment { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 700; }
    .sentiment::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .sentiment.positive::before { background: var(--green); }
    .sentiment.negative::before { background: var(--red); }
    .source-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
    .source-list a { display: block; color: var(--ink); font-size: 11px; line-height: 1.45; text-decoration-color: var(--accent); }
    .source-list time { display: block; color: var(--muted); font-size: 9px; margin-top: 2px; }
    .footer { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--ink); color: var(--muted); font-size: 11px; line-height: 1.7; }
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; gap: 28px; padding-top: 50px; }
      .pick { grid-template-columns: 58px 1fr; }
      .rank { grid-row: 1 / span 3; }
      .identity, .thesis, .evidence { padding: 18px; }
      .thesis { border-top: 1px solid var(--line); }
      .evidence { border: 0; border-top: 1px solid var(--line); }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 22px, 1240px); padding-top: 18px; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .refresh { width: 100%; }
      .pick { grid-template-columns: 48px 1fr; }
      .rank { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand"><span class="brand-mark"></span> QUANT TRADE / TAIWAN</div>
      <a class="advanced" href="/advanced">進階工具與紀錄 →</a>
    </header>

    <section class="hero">
      <div>
        <div class="eyebrow">1–3 month investment radar</div>
        <h1>今天值得研究的<br>十檔台股</h1>
        <p class="lede">從上市、上櫃普通股中，以量價、趨勢、籌碼、基本面與風險品質排序；AI 只補充可驗證的事件脈絡，不拿新聞情緒亂拉分數。</p>
      </div>
      <aside class="status-card">
        <div class="status-label">AI RESEARCH STATUS</div>
        <div class="status-main" id="ai-status">檢查中</div>
        <div class="status-meta" id="ai-detail">正在確認 Codex 訂閱登入與最新分析狀態。</div>
      </aside>
    </section>

    <div class="toolbar">
      <div class="asof" id="asof">正在讀取最新分析…</div>
      <button class="refresh" id="refresh" type="button">重新分析全市場</button>
    </div>
    <div class="notice" id="notice" role="status"></div>
    <section class="list" id="list" aria-live="polite">
      <div class="empty">正在載入 Top 10…</div>
    </section>
    <footer class="footer">
      這是研究排序，不是報酬保證或買賣建議。AI 無法使用時系統仍會提供純量化名單；新聞來源與摘要日期請一併確認。
    </footer>
  </main>

  <script>
    const listEl = document.getElementById('list');
    const noticeEl = document.getElementById('notice');
    const refreshBtn = document.getElementById('refresh');
    const token = localStorage.getItem('quant_trade_control_panel_token') || '';
    const headers = token ? {'X-Control-Panel-Token': token} : {};
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const pct = (value) => value == null ? '—' : `${(Number(value) * 100).toFixed(1)}%`;
    const aiLabels = {
      normal: '正常運作', partial: '部分完成', pending: '等待分析', missing: '未安裝 Codex',
      login_required: '需要登入', usage_limited: '訂閱用量不足', timeout: '分析逾時', error: '暫時無法使用'
    };
    const sentimentLabel = {positive: '偏正面', negative: '偏負面', neutral: '中性'};

    async function api(url, options = {}) {
      const response = await fetch(url, {...options, headers: {...headers, ...(options.headers || {})}});
      const payload = await response.json();
      if (!response.ok || payload.status === 'error') throw new Error(payload.error || '服務回應失敗');
      return payload.data ?? payload;
    }

    function humanReason(tags) {
      const readable = (tags || []).filter(tag => !String(tag).includes('=') && !/^[A-Z0-9_:-]+$/.test(String(tag)));
      return readable.slice(0, 4);
    }

    function render(data) {
      const items = data.items || [];
      document.getElementById('asof').textContent = data.run_id
        ? `資料截止 ${new Date(data.cutoff_at).toLocaleString('zh-TW')} · ${data.candidate_count} 檔候選中選出 ${data.selected_count} 檔`
        : (data.message || '尚無分析快照');
      const status = data.ai_status || data.ai?.status || 'pending';
      document.getElementById('ai-status').textContent = aiLabels[status] || status;
      document.getElementById('ai-detail').textContent = data.error_message
        || data.ai?.detail
        || (status === 'normal' ? '使用 ChatGPT 訂閱的 Codex 分析可驗證事件，量化排名不受 AI 權重影響。' : 'AI 不可用時已自動切換純量化模式。');
      if (!items.length) {
        listEl.innerHTML = `<div class="empty">${escapeHtml(data.message || '尚無 Top 10，請執行第一次全市場分析。')}</div>`;
        return;
      }
      listEl.innerHTML = items.map((item, index) => {
        const reasons = humanReason(item.reason_tags);
        const riskTags = item.risk_tags || [];
        const sources = (item.sources || []).slice(0, 3);
        const summary = item.ai_summary || '本次未取得合格的 AI 事件摘要，排名維持純量化結果。';
        return `
          <article class="pick" style="--i:${index}">
            <div class="rank">${String(item.rank).padStart(2,'0')}</div>
            <div class="identity">
              <div class="symbol">${escapeHtml(item.symbol)}</div>
              <div class="name">${escapeHtml(item.name || '—')}</div>
              <div class="score">量化分數 <strong>${Number(item.quant_score).toFixed(1)}</strong></div>
            </div>
            <div class="thesis">
              <div class="section-label">1–3 個月研究摘要</div>
              <div class="summary ${item.ai_summary ? '' : 'muted'}">${escapeHtml(summary)}</div>
              <div class="tags">
                ${reasons.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                ${riskTags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
              </div>
            </div>
            <div class="evidence">
              <div class="sentiment ${escapeHtml(item.ai_sentiment)}">${sentimentLabel[item.ai_sentiment] || '未判定'} · AI ${escapeHtml(item.ai_status)}</div>
              <ul class="source-list">
                ${sources.length ? sources.map(source => `
                  <li><a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.title)}</a>
                  <time>${escapeHtml(String(source.published_at || '').slice(0,10))}</time></li>`).join('') : '<li class="summary muted">本次沒有通過驗證的新聞引用</li>'}
              </ul>
            </div>
          </article>`;
      }).join('');
    }

    async function load() {
      try {
        const data = await api('/api/shortlist/latest');
        render(data);
      } catch (error) {
        listEl.innerHTML = `<div class="empty">載入失敗：${escapeHtml(error.message)}</div>`;
      }
    }

    async function pollRefresh() {
      const state = await api('/api/status/shortlist-refresh');
      noticeEl.textContent = state.message || '分析執行中…';
      noticeEl.classList.add('show');
      if (state.state === 'done' || state.state === 'error') {
        refreshBtn.disabled = false;
        refreshBtn.textContent = '重新分析全市場';
        await load();
        return;
      }
      setTimeout(pollRefresh, 4000);
    }

    refreshBtn.addEventListener('click', async () => {
      refreshBtn.disabled = true;
      refreshBtn.textContent = '分析執行中…';
      noticeEl.textContent = '正在同步市場資料；全市場第一次分析可能需要幾分鐘。';
      noticeEl.classList.add('show');
      try {
        await api('/api/shortlist/refresh', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({force_ai: true})
        });
        setTimeout(pollRefresh, 1000);
      } catch (error) {
        noticeEl.textContent = `無法啟動分析：${error.message}`;
        refreshBtn.disabled = false;
        refreshBtn.textContent = '重新分析全市場';
      }
    });

    load();
  </script>
</body>
</html>
